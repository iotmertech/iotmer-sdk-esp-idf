name: "iotmer"
version: "0.3.4"
description: "IOTMER IoT Platform SDK for ESP-IDF"
license: "MIT"
url: "https://github.com/iotmertech/iotmer-sdk-esp-idf"
maintainers:
  - "IOTMER Tech <support@iotmer.com>"
tags:
  - "iot"
  - "mqtt"
  - "provisioning"
  - "ota"
  - "ble"
targets:
  - "esp32"
  - "esp32s2"
  - "esp32s3"
  - "esp32c3"
  - "esp32c6"
files:
  include:
    - "CMakeLists.txt"
    - "Kconfig.projbuild"
    - "README.md"
    - "LICENSE"
    - "examples/**"
    - "*.c"
    - "*.h"
    - "include/**"
dependencies:
  idf: ">=6.0.0,<6.2.0"
  # Exact versions. The published manifest is what consumers solve; this
  # component's dependencies.lock is not uploaded. A newer cjson, mqtt, or zlib
  # is used only when this SDK version changes.
  # cJSON and ESP-MQTT are managed components on ESP-IDF 6+ (no longer in core).
  espressif/cjson: "1.7.19~2"
  espressif/mqtt: "1.0.0"
  # Config protocol v1: gzip inflate (RFC1952) for `gzip+base64` responses.
  espressif/zlib: "1.3.2"

